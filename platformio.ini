; PlatformIO Project for M5Stack Basic + AD8232 ECG (RMSSD/HRV)
; Board: M5Stack Basic (ESP32, 4MB Flash)
; Upload: USB (CP210x) - default COM port detected automatically

[env:m5stack-core-esp32]
platform = espressif32
board = m5stack-core-esp32
framework = arduino

upload_speed = 921600
monitor_speed = 460800

; Serial port: set explicitly to avoid picking the Bluetooth COM port
upload_port = COM3
monitor_port = COM3

lib_deps =
    m5stack/M5Stack@^0.4.6

build_flags =
    -DCORE_DEBUG_LEVEL=0
